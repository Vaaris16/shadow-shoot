[package]
name = "shadow-shoot"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.8.0"
bevy = { version = "0.20.0", features = ["debug", "dynamic_linking", "mp3"] }
rand = "0.10.3"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
